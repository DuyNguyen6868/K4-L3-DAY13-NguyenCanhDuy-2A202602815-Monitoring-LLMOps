service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 2000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    2s latency objective, checked against logged latency_ms on 2026-09-29: the CP0
    baseline P95 was 1556 ms, normal runs after instrumentation stay at P95 152-173 ms,
    and rag_slow requests take about 2655 ms (retrieval span 2.5s). A first request
    after a restart can reach 1.3-2.2s and counts against the budget. The dashboard
    contract threshold remains 3s; this SLO is intentionally more proactive.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
