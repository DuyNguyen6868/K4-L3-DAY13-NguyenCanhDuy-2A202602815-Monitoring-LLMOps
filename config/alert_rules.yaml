alerts:
  - name: high_latency_p95
    severity: P2
    condition: "P95(response_sent.latency_ms, 5m) > 2000 ms"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: "Nguyen Canh Duy"
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate_or_retrieval_failure
    severity: P1
    condition: "error_rate_pct > 2 OR retrieval_success_rate_pct < 90"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: "Nguyen Canh Duy"
    runbook: docs/alerts.md#alert-2
  - name: cost_burn_high
    severity: P3
    condition: "sum(response_sent.cost_usd, 1h) > daily_cost_usd_max / 24"
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: "Nguyen Canh Duy"
    runbook: docs/alerts.md#alert-3
